<!doctype html><html lang="ru"><head><link rel="icon" type="image/x-icon" href="favicon.ico"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="assets/style.css"><title>Модерация — демо</title></head><body><header class="wrap top"><a href="index.html" class="logo">POLY WEB</a><nav class="nav"><a href="index.html#reviews">К отзывам</a></nav></header><main class="section wrap"><div class="kicker">Локальный демо-режим</div><h1>Модерация отзывов</h1><p class="notice">Эта страница НЕ защищена паролем и НЕ является реальной админкой. Она управляет только отзывами в этом браузере. Не размещайте её как настоящую панель управления.</p><h2>Ожидают решения</h2><div id="pending"></div></main><script>function draw(){let pending=JSON.parse(localStorage.getItem('poly_reviews_pending')||'[]');let target=document.getElementById('pending');target.replaceChildren();if(!pending.length)target.textContent='Нет ожидающих отзывов';pending.forEach((r,i)=>{let d=document.createElement('div');d.className='review';let h=document.createElement('h3');h.textContent=r.name;let t=document.createElement('p');t.textContent=r.message;let ok=document.createElement('button');ok.className='btn';ok.textContent='Одобрить';ok.onclick=()=>act(i,true);let no=document.createElement('button');no.className='chip';no.textContent='Отклонить';no.onclick=()=>act(i,false);d.append(h,t,ok,document.createTextNode(' '),no);target.append(d)})}function act(i,approve){let pending=JSON.parse(localStorage.getItem('poly_reviews_pending')||'[]');let r=pending.splice(i,1)[0];if(approve&&r){let approved=JSON.parse(localStorage.getItem('poly_reviews_approved')||'[]');approved.push(r);localStorage.setItem('poly_reviews_approved',JSON.stringify(approved))}localStorage.setItem('poly_reviews_pending',JSON.stringify(pending));draw()}draw()</script></body></html>
